<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOONBYUL SCHEDULE</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;600;700&display=swap');

:root {
  --purple: #6C5CE7;
  --purple-dark: #302B63;
  --purple-light: #A29BFE;
  --bg: #F6F4FF;
  --card: #FFFFFF;
  --line: #E8E4FA;
  --text: #2D2A3A;
  --subtext: #8B8798;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  font-family: 'Noto Sans KR', sans-serif;
  background:
    radial-gradient(circle at top right, rgba(162,155,254,.15), transparent 30%),
    #F6F4FF;
  color: var(--text);
}


/* =========================
   HEADER
========================= */

header {
  position: relative;
  overflow: hidden;

  background:
    radial-gradient(ellipse 130% 70% at 25% -15%, rgba(255,255,255,.14), transparent 55%),
    radial-gradient(circle at 15% 20%, rgba(255,255,255,.18) 0 2px, transparent 3px),
    radial-gradient(circle at 85% 30%, rgba(255,255,255,.15) 0 1.5px, transparent 3px),
    linear-gradient(150deg, #2E2A46 0%, #24243E 40%, #6C5CE7 100%);

  color: white;

  padding: 24px 16px 18px;

  box-shadow:
    0 8px 30px rgba(48,43,99,.25);
}

header::before {
  content: "✦   ·     ✧        ·     ✦      ·";
  position: absolute;

  top: 10px;
  left: 0;

  width: 100%;

  font-size: 14px;

  opacity: .5;

  letter-spacing: 8px;

  pointer-events: none;
}

#siteTitle {
  position: relative;
  width: 100%;
  text-align: center;

  font-family: 'Jua', sans-serif;
  font-size: clamp(24px, 7.5vw, 38px);
  letter-spacing: 1px;
  line-height: 1.25;
  margin-top: 14px;

  text-shadow:
    0 4px 15px rgba(0,0,0,.25),
    0 0 20px rgba(255,255,255,.28);

  margin-bottom: 16px;
}


/* =========================
   NAVIGATION
========================= */

#navControls {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  position: relative;
  width: 100%;
  margin: 0 auto;
}

#monthText {

  min-width: 105px;

  text-align: center;

  font-weight: 700;

  font-size: 16px;

  cursor: pointer;

  padding: 7px 10px;

  border-radius: 20px;

  background: rgba(255,255,255,.13);

  backdrop-filter: blur(8px);
}


button {

  border: none;

  font-family: inherit;

  cursor: pointer;

  border-radius: 10px;

  transition:
    transform .15s ease,
    box-shadow .15s ease,
    background .15s ease;

}

button:active {

  transform: scale(.95);

}

@media (hover: hover) {
  #prevBtn:hover,
  #nextBtn:hover {
    background: rgba(255,255,255,.28);
  }

  #todayBtn:hover {
    background: #F1EFFF;
  }

  .modal-content button:hover {
    filter: brightness(.97);
  }
}


/* 이전 다음 버튼 */

#prevBtn,
#nextBtn {

  width: 34px;

  height: 34px;

  padding: 0;

  display: flex;

  align-items: center;

  justify-content: center;

  color: white;

  background: rgba(255,255,255,.15);

  border: 1px solid rgba(255,255,255,.15);

}


/* TODAY */

#todayBtn {

  height: 34px;

  padding: 0 12px;

  color: #51459C;

  background: white;

  font-size: 12px;

  font-weight: 700;

}


/* 유형 필터 */

#typeFilter {

  position: static;


  left: 0;

  height: 34px;

  max-width: 80px;

  padding: 0 8px;

  border-radius: 10px;

  border: none;

  background: rgba(255,255,255,.16);

  color: white;

  font-family: inherit;

  font-size: 12px;

  cursor: pointer;

}

#typeFilter option {

  color: #333;

  background: white;

}


/* =========================
   UPCOMING
========================= */

#upcomingSection {
  padding: 10px 16px 2px;
  background: white;
  border-bottom: 1px solid var(--line);
}

#upcomingTitle {
  font-size: 12px;
  font-weight: 700;
  color: var(--purple-dark);
  margin-bottom: 7px;
}

#upcomingList {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding-bottom: 8px;
  scroll-snap-type: x proximity;
}

#upcomingList::-webkit-scrollbar {
  height: 4px;
}

#upcomingList::-webkit-scrollbar-thumb {
  background: var(--line);
  border-radius: 4px;
}

.upcoming-empty {
  font-size: 12px;
  color: var(--subtext);
  padding: 6px 2px 10px;
}

.upcoming-card {
  flex: 1 1 128px;
  scroll-snap-align: start;
  min-width: 128px;
  max-width: 240px;
  padding: 6px 9px;
  border-radius: 10px;
  background: #F9F7FE;
  border: 1px solid #ECE7F9;
  cursor: pointer;
  transition: transform .15s ease, box-shadow .15s ease;
}

.upcoming-card:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 14px rgba(108,92,231,.15);
}

.upcoming-card .upcoming-dday {
  display: inline-block;
  padding: 1px 6px;
  border-radius: 20px;
  font-size: 9px;
  font-weight: 700;
  color: #fff;
  background: #9B8FEE;
  border: 1px solid #9B8FEE;
  margin-bottom: 3px;
}

.upcoming-card .upcoming-title {
  font-size: 10.5px;
  font-weight: 700;
  color: var(--text);
  line-height: 1.25;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-bottom: 2px;
}

.upcoming-card .upcoming-date {
  font-size: 9px;
  color: var(--subtext);
  font-weight: 500;
  white-space: nowrap;
}


/* =========================
   WEEKDAY
========================= */

#weekdays {

  display: grid;

  grid-template-columns: repeat(7,1fr);

  background: white;

  border-bottom: 1px solid var(--line);

  box-shadow:
    0 3px 12px rgba(60,50,120,.05);

}

.weekday {

  padding: 12px 0;

  text-align: center;

  font-size: 13px;

  font-weight: 700;

  color: #777287;

}

.weekday:first-child {

  color: #FF6B81;

}

.weekday:last-child {

  color: #6C7CFF;

}


/* =========================
   CALENDAR
========================= */

#calendar {

  display: grid;

  grid-template-columns: repeat(7,1fr);

  gap: 0;

  background: var(--line);

  border-top: 1px solid var(--line);

  border-left: 1px solid var(--line);

  margin-bottom: 450px;

}

.day {

  background: white;

  min-height: 145px;

  padding: 7px 5px;

  display: flex;

  flex-direction: column;

  border-right: 1px solid var(--line);

  border-bottom: 1px solid var(--line);

  cursor: pointer;

  transition:
    background .2s ease,
    box-shadow .2s ease;

}

.day:hover {

  background: #FBFAFF;

}

.empty-day {

  pointer-events: none;

  background: #FAF9FD;

}


/* 날짜 */

.day-number {

  width: 27px;

  height: 27px;

  display: flex;

  align-items: center;

  justify-content: center;

  margin: 0 auto 5px;

  border-radius: 50%;

  font-size: 12px;

  font-weight: 700;

}


/* 오늘 */

.day.today {

  background:
    linear-gradient(
      180deg,
      #F7F5FF 0%,
      white 35%
    );

}

.day.today .day-number {

  color: white;

  background:

    linear-gradient(
      135deg,
      #6C5CE7,
      #A29BFE
    );

  box-shadow:
    0 4px 10px rgba(108,92,231,.3);

}


/* 선택 */

.day.selected {

  position: relative;

  z-index: 2;

  box-shadow:
    inset 0 0 0 2px var(--purple);

}


/* =========================
   SCHEDULE
========================= */

.schedule-container {

  flex: 1;

  overflow: visible;

}

.schedule {

  position: relative;

  display: flex;

  flex-direction: column;

  align-items: flex-start;

  width: 100%;

  padding: 5px 6px;

  margin-bottom: 4px;

  border-radius: 8px;

  font-size: 10px;

  font-weight: 500;

  line-height: 1.35;

  cursor: pointer;

  user-select: none;

  overflow-wrap: anywhere;

  box-shadow:

    0 2px 5px rgba(50,40,100,.08);

  transition:

    transform .15s ease,
    box-shadow .15s ease;

}

.schedule:hover {

  transform: translateY(-1px);

  box-shadow:

    0 5px 10px rgba(50,40,100,.12);

}

.schedule.dragging {

  opacity: .5;

  transform: scale(.96);

}

.schedule .link-icon {

  font-size: 10px;

  margin-bottom: 2px;

}

.schedule .title {

  width: 100%;

  word-break: break-word;

}


/* 더보기 */

.schedule-more {

  margin-top: 5px;

  padding: 5px;

  border-radius: 7px;

  text-align: center;

  font-size: 10px;

  font-weight: 600;

  color: var(--purple);

  background: #F2F0FF;

  cursor: pointer;

}


/* =========================
   INPUT BOTTOM SHEET
========================= */

#inputBox {

  position: fixed;

  bottom: 0;

  left: 0;

  width: 100%;

  height: 42vh;

  max-height: 42vh;

  display: none;

  overflow-y: auto;

  z-index: 1000;

  padding:

    16px 16px 24px;

  background: white;

  border-radius:

    22px 22px 0 0;

  box-shadow:

    0 -8px 32px rgba(40,30,80,.14);

}


/* 위쪽 손잡이 */

#inputBox::before {

  content: "";

  display: block;

  width: 40px;

  height: 4px;

  margin: 0 auto 12px;

  border-radius: 5px;

  background: #DDD8F5;

}


/* =========================
   INPUT
========================= */

#inputBox label,
.modal-content label {

  display: block;

  margin:

    14px 0 6px;

  font-size: 11px;

  font-weight: 700;

  letter-spacing: .04em;

  color: #A199B3;

}

.form-divider {
  height: 1px;
  background: #EDEAF3;
  margin: 18px 0 2px;
  border: none;
}

#inputBox input,
#inputBox select,
.modal-content input,
.modal-content select {

  width: 100%;

  height: 38px;

  padding: 0 10px;

  border:

    1px solid #E5E1F3;

  border-radius: 9px;

  background: #FAF9FD;

  font-family: inherit;

  outline: none;

  transition:

    border .2s,
    box-shadow .2s;

}

#inputBox input:focus,
#inputBox select:focus,
.modal-content input:focus,
.modal-content select:focus {

  border-color: var(--purple-light);

  box-shadow:

    0 0 0 3px rgba(108,92,231,.1);

}


/* 날짜 */

.date-row {

  display: flex;

  gap: 8px;

}


/* =========================
   INPUT HEADER
========================= */

.input-header {

  display: flex;

  align-items: center;

  justify-content: space-between;

}

#selectedDate {

  font-size: 17px;

  font-weight: 700;

  color: var(--purple-dark);

}

.input-actions {

  display: flex;

  gap: 6px;

}

#pasteBtn {

  height: 32px;

  padding: 0 10px;

  background: #F1EEFF;

  color: var(--purple);

  font-size: 12px;

  font-weight: 700;

}

#closeInputBtn {

  width: 32px;

  height: 32px;

  padding: 0;

  background: #F4F3F7;

  color: #777;

}


/* 추가 버튼 */

#addBtn {

  width: 100%;

  height: 42px;

  margin-top: 16px;

  background:

    linear-gradient(
      135deg,
      #5B4FCF,
      #7A6CE0
    );

  color: white;

  font-size: 14px;

  font-weight: 700;

  box-shadow:

    0 4px 12px rgba(91,79,207,.22);

}


/* =========================
   MODAL
========================= */

.modal {

  position: fixed;

  inset: 0;

  display: none;

  align-items: center;

  justify-content: center;

  padding: 20px;

  z-index: 1000;

  background:

    rgba(30,25,60,.45);

  backdrop-filter:

    blur(4px);

}

.modal-content {

  width: 100%;

  max-width: 360px;

  max-height: 85vh;

  overflow-y: auto;

  padding: 22px;

  border-radius: 20px;

  background: white;

  border: 1px solid #EDEAF3;

  box-shadow:

    0 16px 44px rgba(30,25,55,.16);

}


/* 모달 버튼 */

.modal-content button {

  width: 100%;

  height: 42px;

  margin-top: 8px;

  font-family: inherit;

  font-weight: 600;

  background: #F8F7FB;

  border: 1px solid #EDEAF3;

  color: #5B5566;

}


/* 수정 */

#actionEditBtn {

  background: #F3F0FE;

  border: 1px solid #DDD4F8;

  color: var(--purple);

}


/* 삭제 */

#actionDeleteBtn {

  background: #FFF3F4;

  border: 1px solid #FAD8DD;

  color: #E35D6A;

}


/* 저장 */

#saveEditBtn {

  background:

    linear-gradient(
      135deg,
      #5B4FCF,
      #7A6CE0
    );

  border: 1px solid transparent;

  color: white;

}


/* 링크 */

#modalLink {

  display: inline-block;

  padding: 8px 10px;

  border-radius: 8px;

  background: #F2F0FF;

  color: var(--purple);

  font-size: 12px;

  text-decoration: none;

  margin-bottom: 4px;

}


/* 상세 팝업 */

.modal-info {
  padding-bottom: 14px;
  margin-bottom: 14px;
  border-bottom: 1px solid #EDEAF3;
}

.type-badge {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 700;
  color: #3A3240;
  margin-bottom: 8px;
}

.modal-title-text {
  font-size: 17px;
  font-weight: 800;
  color: var(--text);
  line-height: 1.35;
  margin-bottom: 6px;
}

.modal-date-text {
  font-size: 12.5px;
  font-weight: 700;
  color: var(--purple);
  margin-bottom: 8px;
}

.modal-desc-text {
  font-size: 12.5px;
  line-height: 1.6;
  color: #5B5566;
  white-space: pre-wrap;
  margin-bottom: 8px;
}

.modal-actions {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.modal-actions button {
  width: 100%;
  height: 42px;
  min-height: auto;
  margin-top: 0;
  padding: 0;
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: center;
  gap: 6px;
  border-radius: 10px;
}

.action-icon {
  font-size: 14px;
  line-height: 1;
}

.action-label {
  font-size: 13px;
  font-weight: 600;
  line-height: 1;
}


/* =========================
   DESKTOP
========================= */

@media (min-width: 601px) {

  body {

    max-width: 1200px;

    margin: auto;

    background-color: #F6F4FF;

  }

  #inputBox {

    max-width: 1200px;

    left: 50%;

    transform: translateX(-50%);

  }

  header {

    border-radius:

      0 0 24px 24px;

  }

  .schedule {

    font-size: 12px;

    padding: 6px 8px;

  }

}


/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

  #upcomingSection {
    padding: 8px 12px 2px;
  }

  .upcoming-card {
    flex: 0 0 auto;
    min-width: 108px;
    max-width: 126px;
    padding: 6px 8px;
  }

  header {

    padding:

      20px 10px 16px;

  }

  #siteTitle {

    font-size: clamp(28px, 10vw, 40px);

    margin-bottom: 14px;

  }

  .title-line {
    display: block;
  }

  .title-line1 {
    transform: translateX(-42px);
  }

  .title-line2 {
    transform: translateX(42px);
  }

  #navControls {

    gap: 5px;

  }

  #typeFilter {

    position: static;

    width: 58px;

    font-size: 10px;

    padding: 0 4px;

  }

  #monthText {

    min-width: 80px;

    font-size: 13px;

  }

  #prevBtn,
  #nextBtn {

    width: 30px;

    height: 30px;

    font-size: 10px;

  }

  #todayBtn {

    height: 30px;

    padding: 0 7px;

    font-size: 10px;

  }

  .weekday {

    padding: 9px 0;

    font-size: 11px;

  }

  .day {

    min-height: 110px;

    padding: 5px 2px;

  }

  .day-number {

    width: 24px;

    height: 24px;

    font-size: 11px;

  }

  .schedule {

    font-size: 7.5px;

    padding: 3px 4px;

    border-radius: 7px;

  }

  #calendar {

    margin-bottom: 270px;

  }

  #inputBox {

    height: 45vh;

    max-height: 45vh;

  }

}


/* ⭐ 일정 내용 여러 줄 입력 */
#inputBox textarea,
.modal-content textarea {
  width: 100%;
  min-height: 90px;
  padding: 10px;

  border: 1px solid #E5E1F3;
  border-radius: 9px;

  background: #FAF9FD;

  font-family: inherit;
  font-size: 13px;
  line-height: 1.5;

  resize: vertical;
  outline: none;
}

#inputBox textarea:focus,
.modal-content textarea:focus {
  border-color: #A29BFE;

  box-shadow:
    0 0 0 3px rgba(108,92,231,.1);
}
.datetime-row {
  display: flex;
  gap: 8px;
}

.datetime-row input[type="date"] {
  flex: 1.4;
}

.datetime-row input[type="time"] {
  flex: 1;
}

</style>
</head>
<body>

<header>
  <div id="siteTitle"><span class="title-line title-line1">🌙MOONBYUL</span><span class="title-line title-line2"> SCHEDULE🌟</span></div>
<div id="navControls">

  <select id="typeFilter">
    <option value="전체">전체</option>
    <option value="기타">기타</option>
    <option value="버블">버블</option>
    <option value="콘서트">콘서트</option>
    <option value="행사">행사</option>
    <option value="발매">발매</option>
    <option value="기념일">기념일</option>
    <option value="방송">방송</option>
    <option value="팬사인회">팬사인회</option>
    <option value="SNS">SNS</option>
    <option value="유튜브">유튜브</option>
  </select>

  <button id="prevBtn">◀</button>
  <span id="monthText"></span>
  <button id="nextBtn">▶</button>
  <button id="todayBtn">Today</button>

</div>
</header>

<div id="upcomingSection">
  <div id="upcomingTitle">✨ 다가오는 일정</div>
  <div id="upcomingList"></div>
</div>

<div id="weekdays"></div>
<div id="calendar"></div>

<div id="inputBox">
  <div class="input-header">
  <div id="selectedDate"></div>
  <div class="input-actions">
  <button id="pasteBtn"> 붙여넣기</button>
  <button id="closeInputBtn">✖</button>
    </div>
  </div>
  <label>일정 제목</label><input id="titleInput" placeholder="일정 제목">
  <label>일정 내용 (선택)</label>
<textarea id="descInput" placeholder="상세 내용을 입력하세요"></textarea>
  <label>링크 (선택)</label><input id="urlInput" placeholder="https://...">
<div class="form-divider"></div>
<label>날짜 및 시간</label>

<div class="datetime-row">
  <input id="dateInput" type="date">
  <input id="timeInput" type="time">
</div>

  <label>유형</label>
  <select id="typeInput">
    <option value="기타">기타</option>
    <option value="버블">버블</option>
    <option value="콘서트">콘서트</option>
    <option value="행사">행사</option>
    <option value="발매">발매</option>
    <option value="기념일">기념일</option>
    <option value="방송">방송</option>
    <option value="팬사인회">팬사인회</option>
    <option value="SNS">SNS</option>
    <option value="유튜브">유튜브</option>

  </select>
    <button id="addBtn">추가</button>

</div>

<div id="actionModal" class="modal">
  <div class="modal-content">
    <div class="modal-info">
      <div id="modalType"></div>
      <div id="modalTitle" class="modal-title-text"></div>
      <div id="modalDate" class="modal-date-text"></div>
      <div id="modalContent" class="modal-desc-text"></div>
      <a id="modalLink" href="#" target="_blank" style="display:none;">🔗 링크</a>
    </div>
    <div class="modal-actions">
      <button id="actionCopyBtn"><span class="action-icon">📋</span><span class="action-label">복사</span></button>
      <button id="actionEditBtn"><span class="action-icon">✏️</span><span class="action-label">수정</span></button>
      <button id="actionDeleteBtn"><span class="action-icon">🗑️</span><span class="action-label">삭제</span></button>
      <button id="actionCancelBtn"><span class="action-icon">✖️</span><span class="action-label">취소</span></button>
    </div>
  </div>
</div>

<div id="editModal" class="modal">
  <div class="modal-content">

const formatDate=k=>{ if(!k) return k; const [y,m,d]=String(k).split("-"); return `${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`; };

/* 시간 오전/오후 변환 */
function formatTimeKorean(time) {
  if (!time) return "";

  const [hourStr, minute] = time.split(":");
  let hour = parseInt(hourStr, 10);

  if (isNaN(hour)) return time;

  const ampm = hour < 12 ? "오전" : "오후";

  hour = hour % 12;

  if (hour === 0) hour = 12;

  return `${ampm} ${hour}:${minute}`;
}

/******** Firestore 실시간 ********/
onSnapshot(schedulesCol, snapshot=>{
  firestoreData={};
  snapshot.docs.forEach(docSnap=>{
    const d=docSnap.data();
    if(!d.date) return;
    const key=formatDate(d.date);
    if(!firestoreData[key]) firestoreData[key]=[];
    firestoreData[key].push({...d,date:key,id:docSnap.id});
  });
  renderCalendar();
  renderUpcoming();
});

/******** 드래그/터치 구현 ********/
function addWebDragEvents(el,dateKey){

  if(selectedTypeFilter !== "전체") return;

  el.setAttribute("draggable","true");

  el.addEventListener("dragstart",()=>{
    dragSrcEl=el;
    el.classList.add("dragging");
  });


  el.addEventListener("dragend",()=>{
    el.classList.remove("dragging");
    dragSrcEl=null;
  });


  el.addEventListener("dragover",e=>{
    e.preventDefault();
  });


  el.addEventListener("drop",async e=>{

    e.preventDefault();

    if(!dragSrcEl || dragSrcEl===el) return;


    const list = firestoreData[dateKey]
      .sort((a,b)=>(a.order??0)-(b.order??0));


    const fromId = dragSrcEl.dataset.id;
    const toId = el.dataset.id;


    const fromIndex = list.findIndex(
      x=>x.id===fromId
    );

    const toIndex = list.findIndex(
      x=>x.id===toId
    );


    const moved = list.splice(fromIndex,1)[0];

    list.splice(toIndex,0,moved);



    const batch = writeBatch(db);


    list.forEach((item,i)=>{

      batch.update(
        doc(schedulesCol,item.id),
        {order:i}
      );

    });


    await batch.commit();

  });
}

function addMobileTouchDrag(el, container, dateKey) {

  if(selectedTypeFilter !== "전체") return;

  let startY = 0;
  let startX = 0;
  let startId = null;
  let pressTimer = null;
  let canDrag = false;
  let moved = false;


  el.addEventListener("touchstart", e => {

    startY = e.touches[0].clientY;
    startX = e.touches[0].clientX;

    startId = el.dataset.id;

    canDrag = false;
    moved = false;


    pressTimer = setTimeout(()=>{

      if(!moved){

        canDrag = true;
        el.classList.add("dragging");

      }

    },250);

  });



  el.addEventListener("touchmove", e => {

    const deltaY =
      e.touches[0].clientY - startY;

    const deltaX =
      e.touches[0].clientX - startX;


    if(!canDrag &&
       Math.abs(deltaY)>5){

      moved=true;
      clearTimeout(pressTimer);

    }


    if(!canDrag) return;


    e.preventDefault();


    el.style.transform =
      `translateY(${deltaY}px) scale(0.95)`;


  },{passive:false});




  el.addEventListener("touchend", async e=>{

    clearTimeout(pressTimer);


    el.style.transform="";
    el.classList.remove("dragging");


    if(!canDrag) return;



    const list =
      firestoreData[dateKey]
      .sort((a,b)=>
        (a.order??0)-(b.order??0)
      );


    const fromIndex =
      list.findIndex(
        x=>x.id===startId
      );


    if(fromIndex===-1) return;



    const touchY =
      e.changedTouches[0].clientY;



    const items =
      Array.from(container.children)
      .filter(x=>x.dataset.id);



    let targetIndex = items.findIndex(item=>{

      const rect =
        item.getBoundingClientRect();

      return touchY <
        rect.top + rect.height/2;

    });



    if(targetIndex===-1)
      targetIndex=items.length-1;



    const toId =
      items[targetIndex]?.dataset.id;


    const toIndex =
      list.findIndex(
        x=>x.id===toId
      );



    if(
      toIndex!==-1 &&
      fromIndex!==toIndex
    ){

      const moved =
        list.splice(fromIndex,1)[0];


      list.splice(toIndex,0,moved);



      const batch = writeBatch(db);


      list.forEach((item,i)=>{

        batch.update(
          doc(schedulesCol,item.id),
          {order:i}
        );

      });


      await batch.commit();

    }


  });

}

function openScheduleModal(it, key){
  selectedDateKey = key;
  activeGroupId = it.groupId;

  modalTitle.textContent = it.title;
  modalContent.textContent = it.content || "(내용 없음)";

  typeBadge.textContent = it.type;

  modalType.appendChild(typeBadge);
  modalLink.style.display = it.url ? "block" : "none";
  if(it.url) modalLink.href = it.url;
  modalDate.textContent = it.time
    ? `${it.date} ${formatTimeKorean(it.time)}`
    : it.date;

  actionModal.style.display = "flex";
  pushModalState();
}

/******** 다가오는 일정 ********/
function renderUpcoming(){
  const todayKey = formatDate(`${new Date().getFullYear()}-${new Date().getMonth()+1}-${new Date().getDate()}`);
  const todayDate = new Date(todayKey);

  const upcomingExcludedTypes = ["SNS","버블","기타"];

  let all = [];
  for(const k in firestoreData){
    firestoreData[k].forEach(it=>{
      if(upcomingExcludedTypes.includes(it.type)) return;
      if(selectedTypeFilter==="전체" || it.type===selectedTypeFilter) all.push(it);
    });
  }

  all = all.filter(it => it.date >= todayKey);
  all.sort((a,b)=>{
    if(a.date !== b.date) return a.date < b.date ? -1 : 1;
    return (a.time||"").localeCompare(b.time||"");
  });

  const upcoming = all.slice(0,5);

  upcomingList.innerHTML = "";

  if(upcoming.length === 0){
    const empty = document.createElement("div");
    empty.className = "upcoming-empty";
    empty.textContent = "다가오는 일정이 없어요";
    upcomingList.appendChild(empty);
    return;
  }

  upcoming.forEach(it=>{
    const diffDays = Math.round((new Date(it.date) - todayDate) / 86400000);
    const ddayLabel = diffDays === 0 ? "오늘" : diffDays === 1 ? "내일" : `D-${diffDays}`;

    const [, mm, dd] = it.date.split("-");

    const card = document.createElement("div");
    card.className = "upcoming-card";

    const dday = document.createElement("span");
    dday.className = "upcoming-dday";
    dday.textContent = ddayLabel;
    card.appendChild(dday);

    const titleRow = document.createElement("div");
    titleRow.className = "upcoming-title";

    const dot = document.createElement("span");
    dot.style.display = "inline-block";
    dot.style.width = "7px";
    dot.style.height = "7px";
    dot.style.borderRadius = "50%";
    dot.style.marginRight = "5px";
    dot.style.background = typeColors[it.type] || "#ccc";
    titleRow.appendChild(dot);

    const titleText = document.createElement("span");
    titleText.textContent = it.title;
    titleRow.appendChild(titleText);

    card.appendChild(titleRow);

    const dateLine = document.createElement("div");
    dateLine.className = "upcoming-date";
    dateLine.textContent = `${parseInt(mm)}월 ${parseInt(dd)}일` + (it.time ? ` · ${formatTimeKorean(it.time)}` : "");
    card.appendChild(dateLine);

    card.onclick = () => {
      const [y,m] = it.date.split("-").map(Number);
      currentDate = new Date(y, m-1, 1);
      renderCalendar();
      openScheduleModal(it, it.date);
    };

    upcomingList.appendChild(card);
  });

}

timeInput.value = "";

 time: timeInput.value || "",

actionCopyBtn.onclick = () => {

  for (const k in firestoreData) {
    firestoreData[k].forEach(it => {
      if (it.groupId === activeGroupId) {
        items.push({ ...it });
      }
    });
  }

  if (items.length === 0) return;

  copiedSchedule = items;

  alert("일정이 복사되었습니다!");
  actionModal.style.display = "none";
  history.back();
};

actionEditBtn.onclick=()=>{
  const items=[];
  for(const k in firestoreData){
    firestoreData[k].forEach(it=>{ if(it.groupId===activeGroupId) items.push({...it,date:k}); });
  }
  if(items.length===0) return;
  items.sort((a,b)=>new Date(a.date)-new Date(b.date));
  const first=items[0];
  editTitleInput.value=first.title;
  editUrlInput.value=first.url||"";
  editTypeInput.value=first.type;
  editDescInput.value=first.content||"";
editDateInput.value = formatDate(first.date);
editTimeInput.value = first.time || "";
  actionModal.style.display="none";
  editModal.style.display="flex";
  // actionModal이 열릴 때 이미 history를 push했으므로 여기서는 추가로 push하지 않음
};

saveEditBtn.onclick = async () => {

  const groupItems = [];

  for (const k in firestoreData) {

    firestoreData[k].forEach(it => {

      if (it.groupId === activeGroupId)
        groupItems.push(it);

    });

  }

  if (!editDateInput.value) return;


  const batch = writeBatch(db);


  /* 기존 일정 삭제 */

  groupItems.forEach(it => {

    batch.delete(
      doc(schedulesCol, it.id)
    );

  });


  /* 새 일정 생성 */

  const key = editDateInput.value;


  const docRef = doc(schedulesCol);


  batch.set(docRef, {

    title: editTitleInput.value,

    url: editUrlInput.value || "",

    type: editTypeInput.value,

    content: editDescInput.value || "",

    date: key,

    time: editTimeInput.value || "",

    groupId: activeGroupId,

    order: firestoreData[key]?.length || 0

  });


  await batch.commit();

  editModal.style.display = "none";
  history.back();

};

actionDeleteBtn.onclick=async ()=>{
  if(!confirm("연속 일정 전체를 삭제할까요?")) return;
  const batch=writeBatch(db);
  for(const k in firestoreData) firestoreData[k].forEach(it=>{ if(it.groupId===activeGroupId) batch.delete(doc(schedulesCol,it.id)); });
  await batch.commit();
  actionModal.style.display="none";
  history.back();
};

  // 1️⃣ 오늘이 있는 월로 이동
  currentDate = new Date(t.getFullYear(), t.getMonth(), 1);
  selectedDateKey = formatDate(`${t.getFullYear()}-${t.getMonth()+1}-${t.getDate()}`);

  renderCalendar();

  // 2️⃣ 오늘 날짜 선택 + 3️⃣ 스크롤 이동
  requestAnimationFrame(() => {
    const todayEl = document.querySelector(".day.today");
    if (!todayEl) return;

    // 선택 표시
    document.querySelectorAll(".day").forEach(d =>
      d.classList.remove("selected")
    );
    todayEl.classList.add("selected");

    // 중앙으로 스크롤
    todayEl.scrollIntoView({
      behavior: "smooth",
      block: "center"
    });
  });
};
 typeFilter.onchange = () => {

  selectedTypeFilter = typeFilter.value;

  expandedDates = {};

  renderCalendar();

  renderUpcoming();

};
/******** 연/월 선택 모달 ********/
const monthPickerModal=document.getElementById("monthPickerModal");
const yearSelect=document.getElementById("yearSelect");
const monthSelect=document.getElementById("monthSelect");
const applyMonthBtn=document.getElementById("applyMonthBtn");
const cancelMonthBtn=document.getElementById("cancelMonthBtn");

function fillYearOptions(){
  yearSelect.innerHTML="";
  const currentYear=new Date().getFullYear();
  for(let y=currentYear-50; y<=currentYear+50; y++){
    const opt=document.createElement("option");
    opt.value=y; opt.textContent=`${y}년`; yearSelect.appendChild(opt);
  }
}

monthText.style.cursor="pointer";
monthText.onclick=()=>{
  fillYearOptions();
  yearSelect.value=currentDate.getFullYear();
  monthSelect.value=currentDate.getMonth();
  monthPickerModal.style.display="flex";
};

applyMonthBtn.onclick=()=>{
  const y=parseInt(yearSelect.value);
  const m=parseInt(monthSelect.value);
  currentDate=new Date(y,m,1);
  selectedDateKey=null;
  monthPickerModal.style.display="none";
  renderCalendar();
};

cancelMonthBtn.onclick=()=>{ monthPickerModal.style.display="none"; };
</script>

<div id="monthPickerModal" class="modal">
  <div class="modal-content">
    <label>연도</label>
    <select id="yearSelect"></select>
    <label>월</label>
    <select id="monthSelect">
      <option value="0">1월</option><option value="1">2월</option><option value="2">3월</option><option value="3">4월</option>
      <option value="4">5월</option><option value="5">6월</option><option value="6">7월</option><option value="7">8월</option>
      <option value="8">9월</option><option value="9">10월</option><option value="10">11월</option><option value="11">12월</option>
    </select>
    <button id="applyMonthBtn">이동</button>
    <button id="cancelMonthBtn">취소</button>
  </div>
</div>

</body>
</html>
