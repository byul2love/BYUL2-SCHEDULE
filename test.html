<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MOONBYUL SCHEDULE</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;800&display=swap');

/* =========================
   THEME TOKENS
========================= */

:root {
  color-scheme: light;
  --bg: #F4F2FB;
  --surface: #FFFFFF;
  --surface-2: #F8F6FE;
  --line: #E7E3F5;
  --text: #262338;
  --sub: #7F7A93;
  --accent: #6C5CE7;
  --accent-2: #9B8CFF;
  --accent-soft: #EEEBFF;
  --accent-text: #5143C9;
  --on-accent: #FFFFFF;
  --hero-1: #1E1B3A;
  --hero-2: #3A2F7A;
  --hero-3: #6C5CE7;
  --gold: #FFB547;
  --sun: #FF6B81;
  --sat: #5B6CFF;
  --danger: #E35D6A;
  --danger-soft: #FFF1F3;
  --shadow: 0 6px 24px rgba(40,30,90,.07);
  --shadow-lg: 0 18px 50px rgba(30,20,70,.22);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0F0E1A;
    --surface: #1A1830;
    --surface-2: #221F3D;
    --line: #2E2A4D;
    --text: #ECEAF7;
    --sub: #9C97B8;
    --accent: #A29BFE;
    --accent-2: #7C6CF0;
    --accent-soft: #2B2650;
    --accent-text: #C4BEFF;
    --on-accent: #17142B;
    --hero-1: #0B0A18;
    --hero-2: #1E1A45;
    --hero-3: #4B3FB8;
    --sun: #FF8A9B;
    --sat: #8C98FF;
    --danger: #FF8A96;
    --danger-soft: #3A1D27;
    --shadow: 0 6px 24px rgba(0,0,0,.3);
    --shadow-lg: 0 18px 50px rgba(0,0,0,.5);
  }
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0F0E1A;
  --surface: #1A1830;
  --surface-2: #221F3D;
  --line: #2E2A4D;
  --text: #ECEAF7;
  --sub: #9C97B8;
  --accent: #A29BFE;
  --accent-2: #7C6CF0;
  --accent-soft: #2B2650;
  --accent-text: #C4BEFF;
  --on-accent: #17142B;
  --hero-1: #0B0A18;
  --hero-2: #1E1A45;
  --hero-3: #4B3FB8;
  --sun: #FF8A9B;
  --sat: #8C98FF;
  --danger: #FF8A96;
  --danger-soft: #3A1D27;
  --shadow: 0 6px 24px rgba(0,0,0,.3);
  --shadow-lg: 0 18px 50px rgba(0,0,0,.5);
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  background: var(--bg);
}

body {
  font-family: 'Noto Sans KR', sans-serif;
  color: var(--text);
  max-width: 1200px;
  margin: 0 auto;
  transition: background .25s ease, color .25s ease;
}

body.locked {
  overflow: hidden;
}

button {
  border: none;
  font-family: inherit;
  cursor: pointer;
  color: inherit;
  background: none;
  transition: transform .15s ease, background .15s ease, filter .15s ease;
}

button:active {
  transform: scale(.96);
}

button:focus-visible,
a:focus-visible,
.day:focus-visible,
.ag-item:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}


/* =========================
   HERO HEADER
========================= */

header.hero {
  position: relative;
  overflow: hidden;
  padding: 18px 16px 20px;
  color: white;
  background: linear-gradient(160deg, var(--hero-1) 0%, var(--hero-2) 55%, var(--hero-3) 100%);
  border-radius: 0 0 28px 28px;
  box-shadow: 0 10px 30px rgba(30,25,80,.25);
}

.stars {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

.stars span {
  position: absolute;
  border-radius: 50%;
  background: white;
  opacity: .2;
  animation: twinkle 3s ease-in-out infinite;
}

@keyframes twinkle {
  0%, 100% { opacity: .15; transform: scale(.8); }
  50% { opacity: .9; transform: scale(1.15); }
}

.moon {
  position: absolute;
  top: -50px;
  right: -40px;
  width: 170px;
  height: 170px;
  border-radius: 50%;
  background: radial-gradient(circle at 38% 38%, rgba(255,236,190,.32), rgba(255,236,190,.08) 55%, transparent 70%);
  pointer-events: none;
}

/* 제목은 가운데 넓게, 검색 버튼은 오른쪽 위 구석에 */
.top-row {
  position: relative;
  padding: 0 44px;
}

.top-row #searchBtn {
  position: absolute;
  top: 0;
  right: 0;
  z-index: 1;
}

.icon-btn {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 17px;
  color: white;
  background: rgba(255,255,255,.12);
  border: 1px solid rgba(255,255,255,.18);
}

@media (hover: hover) {
  .icon-btn:hover,
  .nav-btn:hover,
  #monthText:hover {
    background: rgba(255,255,255,.24);
  }
}

#siteTitle {
  margin: 0;
  text-align: center;
  font-family: 'Jua', sans-serif;
  font-weight: 400;
  font-size: clamp(22px, 6.6vw, 34px);
  letter-spacing: 1px;
  line-height: 1.15;
  text-shadow: 0 4px 16px rgba(0,0,0,.25), 0 0 22px rgba(255,255,255,.22);
}

#siteTitle .accent {
  color: #FFE3A3;
}

/* 휴대폰: 제목을 두 줄로 엇갈리게 (기존 버전 방식) */
@media (max-width: 600px) {
  .top-row {
    padding: 0;
  }

  .top-row #searchBtn {
    width: 36px;
    height: 36px;
    font-size: 15px;
  }

  #siteTitle {
    padding-top: 6px;
    font-size: clamp(32px, 10.6vw, 44px);
    line-height: 1.15;
  }

  #siteTitle .title-line {
    display: block;
  }

  #siteTitle .title-line1 {
    transform: translateX(-22px);
  }

  #siteTitle .title-line2 {
    transform: translateX(22px);
  }
}

#happyBanner {
  position: relative;
  margin: 12px auto 0;
  width: fit-content;
  padding: 6px 16px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 800;
  color: #4A2600;
  background: linear-gradient(90deg, #FFD27A, #FFB547);
  box-shadow: 0 0 18px rgba(255,181,71,.5);
}

#navControls {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin-top: 16px;
}

.nav-btn {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  font-size: 20px;
  line-height: 1;
  color: white;
  background: rgba(255,255,255,.12);
  border: 1px solid rgba(255,255,255,.16);
}

#monthText {
  min-width: 128px;
  height: 38px;
  padding: 0 16px;
  border-radius: 20px;
  font-size: 16px;
  font-weight: 700;
  color: white;
  background: rgba(255,255,255,.12);
  border: 1px solid rgba(255,255,255,.16);
}

#todayBtn {
  height: 38px;
  padding: 0 14px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 800;
  color: #3A2F7A;
  background: white;
}


/* =========================
   FILTER CHIPS
========================= */

.chips {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding: 14px 16px 4px;
  scrollbar-width: none;
}

.chips::-webkit-scrollbar {
  display: none;
}

.chip {
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 32px;
  padding: 0 13px;
  border-radius: 16px;
  font-size: 13px;
  font-weight: 700;
  color: var(--sub);
  background: var(--surface);
  border: 1px solid var(--line);
}

.chip .dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--c);
}

.chip.active {
  color: var(--text);
  background: color-mix(in srgb, var(--c) 20%, var(--surface));
  border-color: var(--c);
}


/* =========================
   UPCOMING
========================= */

#upcomingSection {
  padding: 12px 16px 0;
}

.section-title {
  font-size: 13px;
  font-weight: 700;
  color: var(--sub);
  margin-bottom: 8px;
}

#upcomingList {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 2px 2px 8px;
  scroll-snap-type: x proximity;
  scrollbar-width: none;
}

#upcomingList::-webkit-scrollbar {
  display: none;
}

.up-card {
  position: relative;
  overflow: hidden;
  flex: none;
  width: 168px;
  padding: 11px 13px;
  border-radius: 16px;
  background: var(--surface);
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
  cursor: pointer;
  scroll-snap-align: start;
  transition: transform .15s ease;
}

@media (hover: hover) {
  .up-card:hover {
    transform: translateY(-2px);
  }
}

.up-card.lead {
  color: white;
  border: none;
  background: linear-gradient(135deg, #6C5CE7, #9B8CFF);
}

.up-dday {
  display: inline-block;
  padding: 2px 8px;
  margin-bottom: 6px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 800;
  color: var(--accent-text);
  background: var(--accent-soft);
}

.up-card.lead .up-dday {
  color: #4B3FB8;
  background: white;
}

.up-title {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.up-title .dot {
  flex: none;
  width: 7px;
  height: 7px;
  border-radius: 50%;
}

.up-title span:last-child {
  overflow: hidden;
  text-overflow: ellipsis;
}

.up-date {
  margin-top: 3px;
  font-size: 11.5px;
  color: var(--sub);
  white-space: nowrap;
}

.up-card.lead .up-date {
  color: rgba(255,255,255,.85);
}

.up-ribbon {
  position: absolute;
  top: 0;
  right: 0;
  padding: 3px 8px;
  border-radius: 0 0 0 10px;
  font-size: 9px;
  font-weight: 800;
  color: #4A2600;
  background: var(--gold);
}

/* PC에서 마우스로 끌어서 가로 스크롤 */
@media (hover: hover) and (pointer: fine) {
  .drag-scroll {
    cursor: grab;
  }
}

.drag-scroll.grabbing {
  cursor: grabbing;
  scroll-snap-type: none;
  user-select: none;
}

.drag-scroll.grabbing * {
  pointer-events: none;
}

.up-empty {
  padding: 8px 2px 12px;
  font-size: 13px;
  color: var(--sub);
}


/* =========================
   LAYOUT
========================= */

.layout {
  display: grid;
  gap: 14px;
  padding: 8px 16px 110px;
}

@media (min-width: 900px) {
  .layout {
    grid-template-columns: minmax(0, 1.7fr) minmax(300px, 1fr);
    align-items: start;
    padding-bottom: 40px;
  }

  .agenda-card {
    position: sticky;
    top: 16px;
  }
}

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 22px;
  box-shadow: var(--shadow);
}


/* =========================
   CALENDAR
========================= */

.cal-card {
  padding: 10px 8px 8px;
}

#weekdays {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
}

.weekday {
  padding: 4px 0 8px;
  text-align: center;
  font-size: 12px;
  font-weight: 700;
  color: var(--sub);
}

.weekday.sun { color: var(--sun); }
.weekday.sat { color: var(--sat); }

#calendar {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: 4px;
  touch-action: pan-y;
}

@keyframes calSlideNext {
  from { transform: translateX(26px); opacity: .4; }
  to { transform: translateX(0); opacity: 1; }
}

@keyframes calSlidePrev {
  from { transform: translateX(-26px); opacity: .4; }
  to { transform: translateX(0); opacity: 1; }
}

#calendar.slide-next { animation: calSlideNext .22s ease; }
#calendar.slide-prev { animation: calSlidePrev .22s ease; }

.day {
  position: relative;
  min-height: 58px;
  padding: 6px 2px 5px;
  border-radius: 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  cursor: pointer;
  user-select: none;
  transition: background .15s ease;
}

@media (hover: hover) {
  .day:hover {
    background: var(--surface-2);
  }
}

.day.other-month {
  opacity: .38;
}

.day.selected {
  background: var(--accent-soft);
  box-shadow: inset 0 0 0 1.5px var(--accent);
}

.day-num {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 700;
}

.day.sun .day-num { color: var(--sun); }
.day.sat .day-num { color: var(--sat); }

.day.today .day-num {
  color: var(--on-accent);
  background: var(--accent);
  box-shadow: 0 4px 10px color-mix(in srgb, var(--accent) 40%, transparent);
}

.day .star {
  position: absolute;
  top: 1px;
  right: 3px;
  font-size: 11px;
  color: var(--gold);
}

/* 달력 칸 속 일정 제목 (기존 버전 방식)
   모바일: 작은 글씨로 두 줄까지 / PC: 한 줄 */
.ev-list {
  display: flex;
  flex-direction: column;
  gap: 2px;
  width: 100%;
  min-width: 0;
  margin-top: 3px;
}

.ev {
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
  overflow: hidden;
  overflow-wrap: anywhere;
  padding: 2px 3px;
  border-radius: 4px;
  font-size: 9.5px;
  font-weight: 500;
  line-height: 1.3;
  background: color-mix(in srgb, var(--c) 26%, var(--surface));
  border-left: 2px solid var(--c);
}

.ev.special {
  border: 1px dashed var(--c);
}

.ev-more {
  font-size: 9px;
  font-weight: 700;
  text-align: center;
  color: var(--accent-text);
}

@media (max-width: 767px) {
  .cal-card {
    padding: 10px 4px 6px;
  }

  #calendar {
    gap: 2px;
  }

  .day {
    min-height: 84px;
    padding: 5px 2px 4px;
    align-items: stretch;
  }

  .day-num {
    margin: 0 auto;
  }
}

@media (min-width: 768px) {
  .day {
    min-height: 108px;
    padding: 6px;
    align-items: stretch;
  }

  .day-num {
    margin-bottom: 4px;
  }

  .day .star {
    top: 6px;
    right: 8px;
    font-size: 13px;
  }

  .ev-list {
    gap: 3px;
    margin-top: 0;
  }

  .ev {
    display: block;
    padding: 3px 6px;
    border-radius: 6px;
    font-size: 11.5px;
    line-height: 1.35;
    white-space: nowrap;
    text-overflow: ellipsis;
    background: color-mix(in srgb, var(--c) 22%, var(--surface));
    border-left: 3px solid var(--c);
  }

  .ev.special {
    border: 1.5px dashed var(--c);
  }

  .ev-more {
    padding-left: 4px;
    font-size: 11px;
    text-align: left;
  }
}


/* =========================
   AGENDA
========================= */

.agenda-card {
  padding: 16px;
}

.agenda-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

#agendaDate {
  font-size: 18px;
  font-weight: 800;
}

#agendaSub {
  margin-top: 2px;
  font-size: 12px;
  color: var(--sub);
}

.agenda-actions {
  display: flex;
  gap: 6px;
  flex: none;
}

.pill-btn {
  height: 34px;
  padding: 0 13px;
  border-radius: 17px;
  font-size: 13px;
  font-weight: 700;
  white-space: nowrap;
}

.pill-btn.soft {
  color: var(--accent-text);
  background: var(--accent-soft);
}

.pill-btn.solid {
  color: var(--on-accent);
  background: var(--accent);
}

#agendaList {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-top: 14px;
}

.ag-item {
  display: grid;
  grid-template-columns: 52px minmax(0, 1fr) auto;
  align-items: center;
  gap: 10px;
  padding: 12px;
  border-radius: 16px;
  background: color-mix(in srgb, var(--c) 10%, var(--surface));
  border: 1px solid color-mix(in srgb, var(--c) 35%, var(--line));
  cursor: pointer;
  user-select: none;
  -webkit-touch-callout: none;
  transition: transform .15s ease, box-shadow .15s ease, opacity .15s ease;
}

@media (hover: hover) {
  .ag-item:hover {
    transform: translateY(-1px);
    box-shadow: var(--shadow);
  }
}

.ag-item.special {
  border: 1.5px dashed var(--gold);
}

.ag-item.dragging {
  opacity: .55;
  box-shadow: var(--shadow-lg);
}

.ag-time {
  text-align: center;
  font-size: 12px;
  font-weight: 700;
  line-height: 1.3;
  color: var(--sub);
}

.ag-time b {
  display: block;
  font-size: 14px;
  color: var(--text);
}

.ag-type {
  display: inline-block;
  margin-bottom: 4px;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 10.5px;
  font-weight: 700;
  background: color-mix(in srgb, var(--c) 38%, var(--surface));
}

.ag-title {
  font-size: 14px;
  font-weight: 700;
  line-height: 1.4;
  overflow-wrap: anywhere;
}

.ag-snippet {
  margin-top: 2px;
  font-size: 12px;
  color: var(--sub);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.ag-link {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 15px;
  text-decoration: none;
  background: var(--surface);
  border: 1px solid var(--line);
}

.ag-empty {
  padding: 26px 8px 14px;
  text-align: center;
  font-size: 13px;
  color: var(--sub);
}

.ag-empty .moon-icon {
  display: block;
  font-size: 28px;
  margin-bottom: 6px;
}

.ag-hint {
  margin-top: 10px;
  text-align: center;
  font-size: 11px;
  color: var(--sub);
}


/* =========================
   FAB
========================= */

#fab {
  position: fixed;
  right: 18px;
  bottom: calc(20px + env(safe-area-inset-bottom));
  z-index: 900;
  width: 58px;
  height: 58px;
  border-radius: 50%;
  font-size: 30px;
  line-height: 1;
  color: white;
  background: linear-gradient(135deg, #6C5CE7, #9B8CFF);
  box-shadow: 0 10px 26px rgba(108,92,231,.45);
}

@media (min-width: 900px) {
  #fab {
    display: none;
  }
}


/* =========================
   OVERLAYS (modal + sheet)
========================= */

.overlay {
  position: fixed;
  inset: 0;
  z-index: 1000;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: rgba(15,12,35,.5);
  backdrop-filter: blur(4px);
}

.overlay.open {
  display: flex;
}

.panel {
  width: 100%;
  max-width: 400px;
  max-height: 86vh;
  overflow-y: auto;
  padding: 22px;
  border-radius: 22px;
  color: var(--text);
  background: var(--surface);
  border: 1px solid var(--line);
  box-shadow: var(--shadow-lg);
  animation: pop .18s ease;
}

@keyframes pop {
  from { transform: scale(.96); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

.overlay.sheet {
  align-items: flex-end;
  padding: 0;
}

.overlay.sheet .panel {
  max-width: 560px;
  max-height: 90vh;
  padding: 12px 18px calc(22px + env(safe-area-inset-bottom));
  border-radius: 24px 24px 0 0;
  animation: slideUp .24s ease;
}

.overlay.sheet .panel::before {
  content: "";
  display: block;
  width: 40px;
  height: 4px;
  margin: 0 auto 14px;
  border-radius: 4px;
  background: var(--line);
}

@keyframes slideUp {
  from { transform: translateY(40px); opacity: .3; }
  to { transform: translateY(0); opacity: 1; }
}

@media (min-width: 768px) {
  .overlay.sheet {
    align-items: center;
    padding: 20px;
  }

  .overlay.sheet .panel {
    padding: 22px;
    border-radius: 22px;
    animation: pop .18s ease;
  }

  .overlay.sheet .panel::before {
    display: none;
  }
}

.panel-head {
  display: flex;
  align-items: center;

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-analytics.js";
import { getFirestore, collection, doc, setDoc, onSnapshot, writeBatch } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

/******** Firebase 초기화 ********/
const firebaseConfig = {
    apiKey: "AIzaSyAqCsyAWQ-5wDYEqUuJWgZKCGRyMwDg-ds",
    authDomain: "schedule-fc512.firebaseapp.com",
    projectId: "schedule-fc512",
    storageBucket: "schedule-fc512.firebasestorage.app",
    messagingSenderId: "940626479946",
    appId: "1:940626479946:web:a05efe8ed77b96cd30cfb3",
    measurementId: "G-L6DES7RMV2"
};
const app = initializeApp(firebaseConfig);
try { getAnalytics(app); } catch {}
const db = getFirestore(app);
const schedulesCol = collection(db, "schedules");

// ⭐ 모달 닫기(history.back())할 때 스크롤 위치가 튀는 것 방지
if ('scrollRestoration' in history) {
  history.scrollRestoration = 'manual';
}

const $ = id => document.getElementById(id);

/******** 상수 ********/
// 유형 목록은 여기 한 곳에서만 관리 (필터, 입력 폼이 모두 이걸로 만들어짐)
const TYPES = [
  ["콘서트", "#FF7EB3"],
  ["방송", "#3CCB9A"],
  ["유튜브", "#FF7A7A"],
  ["발매", "#7C9CFF"],
  ["행사", "#B48CF2"],
  ["팬사인회/팬미팅", "#4DB8E8"],
  ["기념일", "#FFB547"],
  ["버블", "#D88CF0"],
  ["SNS", "#E8C93A"],
  ["기타", "#A8A3C7"]
];
const TYPE_COLOR = Object.fromEntries(TYPES);
const colorOf = t => TYPE_COLOR[t] || TYPE_COLOR["기타"];
const WD = ["일","월","화","수","목","금","토"];
const UPCOMING_EXCLUDED = ["SNS","버블","기타"];
const MAX_CHIPS = 3;

/******** 헬퍼 ********/
const gid = () => Math.random().toString(36).slice(2);
const pad = n => String(n).padStart(2, "0");
const keyOf = (y, m, d) => `${y}-${pad(m)}-${pad(d)}`;          // m: 1~12
const keyOfDate = dt => keyOf(dt.getFullYear(), dt.getMonth()+1, dt.getDate());
const todayKey = () => keyOfDate(new Date());
const parseKey = k => { const [y,m,d] = k.split("-").map(Number); return new Date(y, m-1, d); };
// 예전에 저장된 "2026-9-3" 같은 값도 "2026-09-03"으로 정규화
const formatDate = k => { if(!k) return k; const [y,m,d] = String(k).split("-"); return `${y}-${pad(m)}-${pad(d)}`; };

// ⭐ 매년 12월 22일 - 특별 기념일
const isSpecialAnniversary = key => { const [,m,d] = String(key).split("-").map(Number); return m===12 && d===22; };

const diffDays = k => Math.round((parseKey(k) - parseKey(todayKey())) / 86400000);

function relLabel(k){
  const n = diffDays(k);
  if(n === 0) return "오늘";
  if(n === 1) return "내일";
  if(n === -1) return "어제";
  return n > 0 ? `D-${n}` : `${-n}일 전`;
}

function longDate(k){
  const dt = parseKey(k);
  return `${dt.getFullYear()}년 ${dt.getMonth()+1}월 ${dt.getDate()}일 (${WD[dt.getDay()]})`;
}

/* 시간 오전/오후 변환 */
function splitTimeKorean(time){
  if(!time) return null;
  const [hStr, minute] = time.split(":");
  let hour = parseInt(hStr, 10);
  if(isNaN(hour)) return null;
  const ampm = hour < 12 ? "오전" : "오후";
  hour = hour % 12 || 12;
  return { ampm, hm: `${hour}:${minute}` };
}

function formatTimeKorean(time){
  const t = splitTimeKorean(time);
  return t ? `${t.ampm} ${t.hm}` : (time || "");
}

// ⭐ 링크 검사: http/https 주소만 허용 (javascript: 등 차단)
// 빈 값이면 "", 잘못된 주소면 null, 정상이면 정규화된 주소 반환
function safeUrl(u){
  const v = String(u || "").trim();
  if (!v) return "";
  const withScheme = /^[a-z][a-z0-9+.-]*:/i.test(v) ? v : `https://${v}`;
  try {
    const parsed = new URL(withScheme);
    if (parsed.protocol !== "http:" && parsed.protocol !== "https:") return null;
    if (!parsed.hostname.includes(".")) return null;
    return parsed.href;
  } catch {
    return null;
  }
}

// ⭐ 사이트 주소 없이 뜨는 자체 알림 토스트
const toast = $("toast");
let toastTimer = null;
function showToast(msg){
  toast.textContent = msg;
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove("show"), 1800);
}

function el(tag, className, text){
  const e = document.createElement(tag);
  if(className) e.className = className;
  if(text != null) e.textContent = text;
  return e;
}

/******** 상태 ********/
const now = new Date();
let currentDate = new Date(now.getFullYear(), now.getMonth(), 1);
let selectedDateKey = todayKey();
let firestoreData = {};
let loaded = false;
let selectedTypeFilter = "전체";
let copiedSchedule = null;
let activeItem = null;
let formMode = "add";
let formType = "기타";
let pickerYear = now.getFullYear();

function daySchedules(key, all = false){
  return (firestoreData[key] || [])
    .filter(it => all || selectedTypeFilter === "전체" || it.type === selectedTypeFilter)
    .sort((a,b) => (a.order ?? 0) - (b.order ?? 0));
}

// groupId가 없는 옛날 일정은 자기 자신만 묶음으로 취급 (다른 일정이 같이 지워지지 않게)
function groupOf(it){
  if(!it) return [];
  if(!it.groupId) return [it];
  const r = [];
  for(const k in firestoreData) firestoreData[k].forEach(x => { if(x.groupId === it.groupId) r.push(x); });
  return r.length ? r : [it];
}

/******** 헤더 별 ********/
const starsEl = $("stars");
for(let i = 0; i < 38; i++){
  const s = document.createElement("span");
  const size = Math.random() < .2 ? 3 : 2;
  s.style.width = s.style.height = `${size}px`;
  s.style.left = `${Math.random()*100}%`;
  s.style.top = `${Math.random()*100}%`;
  s.style.animationDelay = `${Math.random()*4}s`;
  s.style.animationDuration = `${2.5 + Math.random()*3}s`;
  starsEl.appendChild(s);
}

if(isSpecialAnniversary(todayKey())) $("happyBanner").hidden = false;

/******** 오버레이 (모달 + 뒤로가기) ********/
const overlays = [...document.querySelectorAll(".overlay")];
let overlayOpen = false;

function hideAllOverlays(){
  overlays.forEach(o => o.classList.remove("open"));
  document.body.classList.remove("locked");
}

// 이미 다른 창이 열려 있으면 history를 추가하지 않고 바꿔치기만 함
function showOverlay(o){
  overlays.forEach(x => x.classList.remove("open"));
  o.classList.add("open");
  document.body.classList.add("locked");
  if(!overlayOpen){
    history.pushState({ mbModal: true }, "");
    overlayOpen = true;
  }
}

function closeOverlay(){
  if(overlayOpen) history.back();
  else hideAllOverlays();
}

// ⭐ 모바일 뒤로가기 처리
window.addEventListener("popstate", () => {
  overlayOpen = false;
  hideAllOverlays();
});

overlays.forEach(o => {
  o.addEventListener("click", e => { if(e.target === o) closeOverlay(); });
  o.querySelectorAll("[data-close]").forEach(b => b.onclick = closeOverlay);
});

document.addEventListener("keydown", e => {
  if(e.key === "Escape" && overlayOpen) closeOverlay();
});

/******** Firestore 실시간 ********/
onSnapshot(schedulesCol, snapshot => {
  firestoreData = {};
  snapshot.docs.forEach(docSnap => {
    const d = docSnap.data();
    if(!d.date) return;
    const key = formatDate(d.date);
    (firestoreData[key] ||= []).push({ ...d, date: key, id: docSnap.id });
  });
  loaded = true;
  renderAll();
}, () => showToast("일정을 불러오지 못했어요."));

function renderAll(){
  renderCalendar();
  renderAgenda();
  renderUpcoming();
}

/******** 필터 칩 ********/
const filterChips = $("filterChips");

function renderChips(){

const calendar = $("calendar");
const weekdaysDiv = $("weekdays");
const monthText = $("monthText");

function selectDate(key){
  selectedDateKey = key;
  calendar.querySelectorAll(".day").forEach(x => x.classList.toggle("selected", x.dataset.key === key));
  renderAgenda();
}

function goToDate(key, direction){
  const dt = parseKey(key);
  currentDate = new Date(dt.getFullYear(), dt.getMonth(), 1);
  selectedDateKey = key;
  renderCalendar(direction);
  renderAgenda();
}

function renderCalendar(direction){
  const y = currentDate.getFullYear(), m = currentDate.getMonth();
  monthText.textContent = `${y}년 ${m+1}월`;
  calendar.innerHTML = "";

  const first = new Date(y, m, 1).getDay();
  const last = new Date(y, m+1, 0).getDate();
  const cells = [];
  for(let i = first; i > 0; i--) cells.push({ date: new Date(y, m, 1 - i), other: "prev" });
  for(let d = 1; d <= last; d++) cells.push({ date: new Date(y, m, d), other: null });
  for(let d = 1; cells.length % 7; d++) cells.push({ date: new Date(y, m+1, d), other: "next" });

  const tk = todayKey();

  cells.forEach(({ date, other }, idx) => {
    const key = keyOfDate(date);
    const items = daySchedules(key);
    const dow = idx % 7;

    const day = el("div", "day");
    day.dataset.key = key;
    day.tabIndex = 0;
    if(dow === 0) day.classList.add("sun");
    if(dow === 6) day.classList.add("sat");
    if(other) day.classList.add("other-month");
    if(key === tk) day.classList.add("today");
    if(key === selectedDateKey) day.classList.add("selected");
    day.setAttribute("aria-label", `${date.getMonth()+1}월 ${date.getDate()}일, 일정 ${items.length}개`);

    day.appendChild(el("div", "day-num", date.getDate()));
    if(isSpecialAnniversary(key)) day.appendChild(el("span", "star", "★"));

    // 일정 제목 칩
    const list = el("div", "ev-list");
    items.slice(0, MAX_CHIPS).forEach(it => {
      const ev = el("div", "ev" + (isSpecialAnniversary(key) ? " special" : ""), it.title);
      ev.style.setProperty("--c", colorOf(it.type));
      ev.onclick = e => {
        // 휴대폰은 칸이 작아서 칩을 눌러도 날짜 선택으로 처리 (아래 목록에서 보기)
        if(!matchMedia("(min-width: 768px)").matches) return;
        e.stopPropagation();
        if(other) goToDate(key, other); else selectDate(key);
        openDetail(it);
      };
      list.appendChild(ev);
    });
    if(items.length > MAX_CHIPS) list.appendChild(el("div", "ev-more", `+${items.length - MAX_CHIPS}개`));
    day.appendChild(list);

    const activate = () => {
      if(other){ goToDate(key, other); return; }
      if(selectedDateKey === key){ openForm("add", { date: key }); return; }
      selectDate(key);
      revealAgendaIfHidden();
    };
    day.onclick = activate;
    day.onkeydown = e => { if(e.key === "Enter" || e.key === " "){ e.preventDefault(); activate(); } };

    calendar.appendChild(day);
  });

  if(direction){
    calendar.classList.remove("slide-next", "slide-prev");
    void calendar.offsetWidth;
    calendar.classList.add(direction === "next" ? "slide-next" : "slide-prev");
  }
}

// 모바일에서 날짜를 눌렀는데 일정 목록이 화면 밖이면 살짝 보여주기

/******** 순서 바꾸기 (드래그 / 길게 눌러 끌기) ********/
let dragSrcId = null;

async function reorder(key, fromId, toId){
  const list = daySchedules(key, true);
  const fi = list.findIndex(x => x.id === fromId);
  const ti = list.findIndex(x => x.id === toId);
  if(fi < 0 || ti < 0 || fi === ti) return;
  const [moved] = list.splice(fi, 1);
  list.splice(ti, 0, moved);
  const batch = writeBatch(db);
  list.forEach((it, i) => batch.update(doc(schedulesCol, it.id), { order: i }));
  try { await batch.commit(); } catch { showToast("순서를 바꾸지 못했어요."); }
}

function enableReorder(row, key){
  if(selectedTypeFilter !== "전체") return;

  // PC 드래그
  row.draggable = true;
  row.addEventListener("dragstart", e => {
    dragSrcId = row.dataset.id;
    row.classList.add("dragging");
    e.dataTransfer.effectAllowed = "move";
  });
  row.addEventListener("dragend", () => {
    row.classList.remove("dragging");
    dragSrcId = null;
  });
  row.addEventListener("dragover", e => e.preventDefault());
  row.addEventListener("drop", e => {
    e.preventDefault();
    if(dragSrcId && dragSrcId !== row.dataset.id) reorder(key, dragSrcId, row.dataset.id);
  });

  // 모바일: 길게 눌러서 위아래로 끌기
  let startY = 0, startX = 0, timer = null, canDrag = false;

  row.addEventListener("touchstart", e => {
    startY = e.touches[0].clientY;
    startX = e.touches[0].clientX;
    canDrag = false;
    timer = setTimeout(() => {
      canDrag = true;
      row.classList.add("dragging");
      navigator.vibrate?.(12);
    }, 320);
  }, { passive: true });

  row.addEventListener("touchmove", e => {
    const dy = e.touches[0].clientY - startY;
    const dx = e.touches[0].clientX - startX;
    if(!canDrag){
      if(Math.abs(dy) > 8 || Math.abs(dx) > 8) clearTimeout(timer);
      return;
    }
    e.preventDefault();
    row.style.transform = `translateY(${dy}px) scale(.97)`;
  }, { passive: false });

  row.addEventListener("touchend", e => {
    clearTimeout(timer);
    row.style.transform = "";
    row.classList.remove("dragging");
    if(!canDrag) return;
    canDrag = false;
    row.dataset.suppressClick = "1";

    const y = e.changedTouches[0].clientY;
    const rows = [...agendaList.querySelectorAll(".ag-item")];
    let target = rows.find(r => y < r.getBoundingClientRect().top + r.getBoundingClientRect().height / 2);
    if(!target) target = rows[rows.length - 1];
    if(target && target.dataset.id !== row.dataset.id) reorder(key, row.dataset.id, target.dataset.id);
  });

  row.addEventListener("touchcancel", () => {
    clearTimeout(timer);
    canDrag = false;
    row.style.transform = "";
    row.classList.remove("dragging");
  });
}

/******** PC 가로 스크롤 (마우스 끌기 + 휠) ********/
function enableDragScroll(box){
  box.classList.add("drag-scroll");
  let down = false, moved = false, startX = 0, startLeft = 0;

  box.addEventListener("pointerdown", e => {
    if(e.pointerType !== "mouse" || e.button !== 0) return;
    down = true;
    moved = false;
    startX = e.clientX;
    startLeft = box.scrollLeft;
    e.preventDefault();
  });

  window.addEventListener("pointermove", e => {
    if(!down) return;
    const dx = e.clientX - startX;
    if(!moved && Math.abs(dx) > 5){
      moved = true;
      box.classList.add("grabbing");
    }
    if(moved) box.scrollLeft = startLeft - dx;
  });

  window.addEventListener("pointerup", () => {
    if(!down) return;
    down = false;
    box.classList.remove("grabbing");
  });

  // 끌기가 끝났을 때 카드가 클릭되어 상세 창이 열리는 것 방지
  box.addEventListener("click", e => {
    if(moved){
      e.stopPropagation();
      e.preventDefault();
      moved = false;
    }
  }, true);

  // 마우스 휠(세로)로도 가로로 넘기기. 끝에 닿으면 페이지 스크롤로 넘김
  box.addEventListener("wheel", e => {
    if(Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return;
    const max = box.scrollWidth - box.clientWidth;
    if(max <= 0) return;
    const atEdge = (e.deltaY < 0 && box.scrollLeft <= 0) || (e.deltaY > 0 && box.scrollLeft >= max - 1);
    if(atEdge) return;
    e.preventDefault();
    box.scrollLeft += e.deltaY;
  }, { passive: false });
}

enableDragScroll(upcomingList);
enableDragScroll(filterChips);

/******** 첫 화면 ********/
renderChips();
renderAll();
</script>
